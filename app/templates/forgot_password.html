<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password — Ascent</title>
<link rel="stylesheet" href="/static/auth.css">
<style>
.success{background:#0f2a1a;border:1px solid #14532d;border-radius:8px;
  color:#86efac;padding:.6rem .75rem;font-size:12px;margin-bottom:1rem}
.back-link{display:block;text-align:center;margin-top:.75rem;
  color:#f97316;font-size:12px;text-decoration:none}
.back-link:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><img src="/static/favicon.svg" style="width:32px;height:32px;border-radius:6px;margin-right:8px;vertical-align:middle">Ascent</div>
  <div class="subtitle">Reset your password</div>

  {% if sent %}
  <div class="success">If that email address has an account, a reset link has been sent. Check your inbox.</div>
  <a class="back-link" href="/login">Back to sign in</a>
  {% else %}
  <p style="color:#8e8e93;font-size:12px;margin-bottom:1.25rem">Enter your email address and we'll send you a link to reset your password.</p>
  <form method="post" action="/forgot-password">
    <label>Email address</label>
    <input type="email" name="email" autocomplete="email" autocorrect="off" autocapitalize="none" spellcheck="false" required autofocus>
    <button type="submit" class="btn">Send Reset Link</button>
  </form>
  <a class="back-link" href="/login">Back to sign in</a>
  {% endif %}

  <div class="footer">Ascent {{ app_version }}</div>
</div>
</body>
</html>
