{% set mob_active = mob_active | default('') %}
<div id="mob-global-nav">
  <a href="/activities" class="mob-nav-btn{% if mob_active == 'activities' %} active{% endif %}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    <span>Activities</span>
  </a>
  <a href="/" class="mob-nav-btn{% if mob_active == 'summary' %} active{% endif %}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>
    <span>Summary</span>
  </a>
  <a href="/routes" class="mob-nav-btn{% if mob_active == 'routes' %} active{% endif %}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M6 17C6 11 18 13 18 7"/></svg>
    <span>Routes</span>
  </a>
  <a href="/tour" class="mob-nav-btn{% if mob_active == 'tours' %} active{% endif %}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6-12 4 6 3-4 5 10H3z"/></svg>
    <span>Tours</span>
  </a>
  <a href="/activities" id="mob-coach-nav-btn" class="mob-nav-btn{% if mob_active == 'coach' %} active{% endif %}" onclick="sessionStorage.setItem('openCoach','1')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span>Coach</span>
  </a>
  <a href="/settings" class="mob-nav-btn{% if mob_active == 'settings' %} active{% endif %}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Settings</span>
  </a>
</div>
<script src="/static/mob_nav_anchor.js?v={{ app_version }}"></script>
<script>
(function(){
  if (!window.navigator.standalone) return;
  // Runs immediately after the nav element above (before first paint). On fixed-layout
  // pages, position:fixed;bottom:0 anchors to the SHORT layout viewport, so the nav sits
  // too high — MobNavAnchor re-pins it to the physical screen bottom. Scroll pages
  // (has-mob-topbar: Summary, Settings) already anchor correctly via CSS and the nav grows
  // upward there, so leave them alone. Hide until placed so there's no first-paint flash.
  var nav = document.getElementById('mob-global-nav');
  if (!nav) return;
  if (document.body && document.body.classList.contains('has-mob-topbar')) return;
  nav.style.visibility = 'hidden';
  function place() {
    // null → not standalone / landscape: drop inline styles, fall back to CSS.
    if (window.MobNavAnchor.anchorBottomBar(nav, 58) === null) {
      nav.style.top = ''; nav.style.bottom = ''; nav.style.height = ''; nav.style.paddingBottom = '';
    }
    nav.style.visibility = '';
  }
  place();   // synchronous — before first paint, stable values only
  window.addEventListener('resize', place);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', place);
  window.addEventListener('load', place);
  window.addEventListener('pageshow', place);   // bfcache restore
  // Cold launch (iOS standalone): visualViewport.height isn't settled at the first
  // synchronous paint and no resize fires afterward, so the nav lands too high until a
  // navigation gives correct metrics. Re-measure unconditionally once it settles.
  requestAnimationFrame(place);
  setTimeout(place, 300);
  // Failsafe: never leave the nav hidden.
  setTimeout(function(){ if (nav.style.visibility === 'hidden') place(); }, 800);
})();
</script>
