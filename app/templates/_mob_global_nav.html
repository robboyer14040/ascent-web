  </a>

    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>

    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>

  <a href="/settings" class="mob-nav-btn{% if mob_active == 'settings' %} active{% endif %}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Settings</span>
  </a>
</div>
<script>
(function(){
  if (!window.navigator.standalone) return;
  // This script runs immediately after the nav element above, so getElementById finds it and
  // the hide below applies before first paint (avoiding the reposition flash).
  //
  // position:fixed;bottom:0 anchors to window.innerHeight, which keeps CHANGING during load
  // on fixed-layout pages (852 → 828) — so any bottom-based offset jumps as it settles.
  // Instead anchor to a STABLE reference: place the nav's top at (physical screen height −
  // nav height). screen.height never changes, so the nav's bottom edge sits at the physical
  // bottom on every page and never moves. Hide until placed so there's no first-paint flash.
  var nav = document.getElementById('mob-global-nav');
  if (!nav) return;
  nav.style.visibility = 'hidden';
  // Nav height is deterministic from CSS: calc(58px + safe-area-inset-bottom) — see
  // mob_nav.css. Read the safe inset from a probe (resolves immediately) rather than the
  // nav's offsetHeight, which reads short on heavy pages (Settings) before its padding applies.
  function safeBottom() {
    var p = document.createElement('div');
    p.style.cssText = 'position:fixed;left:0;bottom:0;width:0;height:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none';
    document.body.appendChild(p);
    var h = p.offsetHeight;
    document.body.removeChild(p);
    return h;
  }
  function place() {
    if (window.innerWidth >= window.innerHeight) { // landscape → CSS side-bar
      nav.style.top = ''; nav.style.bottom = ''; nav.style.height = ''; nav.style.paddingBottom = ''; nav.style.visibility = '';
      return;
    }
    var screenH = Math.max(window.screen.width, window.screen.height);
    var safe = safeBottom();
    var navH = 58 + safe;
    // Pin height + bottom padding explicitly too: on Settings env() resolves after first paint,
    // so the nav's CSS height is briefly 58px and the bottom strip shows through. Setting them
    // here makes the nav full-size the instant it's revealed.
    nav.style.bottom = 'auto';
    nav.style.height = navH + 'px';
    nav.style.paddingBottom = safe + 'px';
    nav.style.top = (screenH - navH) + 'px';
    nav.style.visibility = '';
  }
  requestAnimationFrame(place);
  window.addEventListener('resize', place);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', place);
  window.addEventListener('load', place);
  // Failsafe: never leave the nav hidden.
  setTimeout(function(){ if (nav.style.visibility === 'hidden') place(); }, 800);
})();
</script>
