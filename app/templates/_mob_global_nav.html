{% set mob_active = mob_active | default('') %}
<script>
(function(){
  if (!window.navigator.standalone) return;
  // In standalone, position:fixed;bottom:0 anchors to window.innerHeight. On body-scrolling
  // pages innerHeight equals the physical screen, but on fixed-layout pages it's ~24px
  // shorter — so the nav floats above the home indicator there. Push it down by exactly that
  // gap (screen height − innerHeight): 0 on scrolling pages, the float amount on fixed pages.
  function fix() {
    var nav = document.getElementById('mob-global-nav');
    if (!nav) return;
    if (window.innerWidth >= window.innerHeight) { nav.style.top = ''; nav.style.bottom = ''; return; } // landscape → CSS side-bar
    var screenH = Math.max(window.screen.width, window.screen.height);
    var gap = screenH - window.innerHeight;
    nav.style.top = '';
    nav.style.bottom = (gap > 0 ? -gap : 0) + 'px';
  }
  window.addEventListener('load', function(){ requestAnimationFrame(fix); });
  window.addEventListener('resize', fix);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fix);
})();
</script>
<script>
/* Nav-position diagnostic. Enable once by visiting any page with ?navdebug=1 (persists via
   localStorage); disable with ?navdebug=0. Prints the viewport values so the nav-jump fix
   can be computed exactly instead of guessed. Remove after diagnosing. */
(function(){
  // TEMPORARY: auto-on in standalone (Home Screen app) so no URL flag is needed.
  try {
    if (location.search.indexOf('navdebug=0') >= 0) { localStorage.removeItem('navdebug'); return; }
    if (!window.navigator.standalone && !localStorage.getItem('navdebug')) return;
  } catch(e) { if (!window.navigator.standalone) return; }
  function safeInset(){ var p=document.createElement('div');
    p.style.cssText='position:fixed;bottom:0;left:0;width:1px;height:env(safe-area-inset-bottom,0px)';
    document.body.appendChild(p); var h=p.offsetHeight; p.parentNode.removeChild(p); return h; }
  function show(){
    var nav=document.getElementById('mob-global-nav');
    var r=nav?nav.getBoundingClientRect():{top:0,bottom:0};
    var vv=window.visualViewport||{};
    var d=document.getElementById('__navdbg')||document.createElement('div');
    d.id='__navdbg';
    d.style.cssText='position:fixed;top:96px;left:8px;right:8px;z-index:99999;background:rgba(0,0,0,.88);color:#3f3;font:12px/1.5 monospace;padding:8px 10px;border-radius:8px;white-space:pre;pointer-events:none';
    d.textContent =
      'path='+location.pathname+'   standalone='+window.navigator.standalone+'\n'+
      'innerH='+window.innerHeight+'  screenH='+Math.max(screen.width,screen.height)+'\n'+
      'vv.height='+Math.round(vv.height||0)+'  vv.offsetTop='+Math.round(vv.offsetTop||0)+'\n'+
      'safeInsetBottom='+safeInset()+'\n'+
      'navOffsetH='+(nav?nav.offsetHeight:0)+'  navTop='+Math.round(r.top)+'  navBottom='+Math.round(r.bottom)+'\n'+
      'has-mob-topbar='+document.body.classList.contains('has-mob-topbar')+
      '   standalone-pwa='+document.documentElement.classList.contains('standalone-pwa');
    if(!d.parentNode) document.body.appendChild(d);
  }
  window.addEventListener('load', function(){ setTimeout(show, 350); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', show);
})();
</script>
