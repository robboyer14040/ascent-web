    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Settings</span>
  </a>
</div>
<script>
(function(){
  if (!window.navigator.standalone) return;
  // This script runs immediately after the nav element above, so getElementById finds it and
  // the hide below applies before first paint (avoiding the reposition flash).
  //
  // In standalone, position:fixed;bottom:0 anchors to window.innerHeight. On body-scrolling
  // pages innerHeight equals the physical screen, but on fixed-layout pages it settles ~24px
  // shorter AFTER first layout — so we hide the nav until innerHeight stops changing, then
  // push it down by exactly the gap (screen height − innerHeight): 0 on scrolling pages, the
  // float amount on fixed pages. The nav is revealed only once, already in its final spot.
  var nav = document.getElementById('mob-global-nav');
  if (!nav) return;
  nav.style.visibility = 'hidden';
  function place() {
    if (window.innerWidth >= window.innerHeight) { nav.style.top = ''; nav.style.bottom = ''; nav.style.visibility = ''; return; } // landscape → CSS side-bar
    var screenH = Math.max(window.screen.width, window.screen.height);
    var gap = screenH - window.innerHeight;
    nav.style.top = '';
    nav.style.bottom = (gap > 0 ? -gap : 0) + 'px';
    nav.style.visibility = '';
  }
  // Wait until innerHeight stops changing (settles) before positioning + revealing, so the
  // nav is never painted at a stale position.
  var last = null, stable = 0, tries = 0;
  function waitStable() {
    var ih = window.innerHeight;
    if (ih === last) stable++; else { stable = 0; last = ih; }
    if (stable >= 2 || tries >= 30) { place(); return; }
    tries++;
    requestAnimationFrame(waitStable);
  }
  requestAnimationFrame(waitStable);
  window.addEventListener('resize', place);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', place);
  window.addEventListener('load', place);
  // Failsafe: never leave the nav hidden.
  setTimeout(function(){ if (nav.style.visibility === 'hidden') place(); }, 800);
})();
</script>
