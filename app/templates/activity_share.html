<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1c1e">
<title>{{ activity_name }} — Ascent</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/static/common.css?v={{ app_version }}">
<link rel="stylesheet" href="/static/tour_stage.css?v={{ app_version }}">
<link rel="stylesheet" href="/static/share_detail.css?v={{ app_version }}">
<link rel="stylesheet" href="/static/tour_mob_nav.css?v={{ app_version }}">
<style>
.nav-sub{font-size:11px;color:var(--muted)}
.nav-theme{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:4px;line-height:1;flex-shrink:0}
/* Mobile header — phones get the shared tab layout (TourNav / tour_mob_nav.css),
   which hides #page and fills Map / Analysis / Photos panels instead. */
#mob-header{display:none}
@media(max-width:767px),(max-height:500px) and (orientation:landscape) and (pointer:coarse){
  nav{display:none}
  #mob-header{
    display:flex;align-items:center;gap:8px;position:fixed;top:0;left:0;right:0;
    height:calc(52px + env(safe-area-inset-top,0px));
    padding:env(safe-area-inset-top,0px) 14px 0;
    background:var(--surface);border-bottom:1px solid var(--border);z-index:600
  }
  #mob-title{font-size:14px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body{padding-top:calc(52px + env(safe-area-inset-top,0px))}
  #page{height:calc(100vh - 52px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
}
/* Landscape phone: the panels start at the top of the screen — no room for a header. */
@media(max-height:500px) and (orientation:landscape) and (pointer:coarse){
  body.tour-mob-nav #mob-header{display:none!important}
  body.tour-mob-nav{padding-top:0}
}
</style>
</head>
<body>

<nav>
  <div style="display:flex;align-items:center">
    <a href="/"><img src="/static/favicon.svg" style="width:20px;height:20px;border-radius:4px;margin-right:6px;vertical-align:middle"><span class="nav-brand-name">Ascent</span></a>
  </div>
  <span style="font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:12px;min-width:0">{{ activity_name }}</span>
  <div class="spacer"></div>
  <span class="nav-sub">shared by <strong style="color:var(--text)">{{ display_name }}</strong></span>
  <button class="nav-theme" onclick="toggleTheme()" title="Toggle light/dark theme" style="margin-left:10px">◑</button>
</nav>

<div id="mob-header">
  <span id="mob-title">{{ activity_name }}</span>
  <button class="nav-theme" onclick="toggleTheme()" title="Toggle theme" style="font-size:17px">◑</button>
</div>

<div id="page">
  <div id="main">
    {% include '_share_detail.html' %}
  </div>
</div>

{% set mob_nav_solo = true %}
{% include '_tour_mob_nav.html' %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/static/common.js?v={{ app_version }}"></script>
<script src="/static/tour_units.js?v={{ app_version }}"></script>
<script src="/static/share_common.js?v={{ app_version }}"></script>
<script src="/static/location_summary.js?v={{ app_version }}"></script>
<script src="/static/activity_chips.js?v={{ app_version }}"></script>
<script src="/static/map_utils.js"></script>
<script src="/static/lightbox.js?v={{ app_version }}"></script>
<script src="/static/elev_panel.js?v={{ app_version }}"></script>
<script src="/static/elev_gradient.js?v={{ app_version }}"></script>
<script src="/static/stage_elev_chart.js?v={{ app_version }}"></script>
<script src="/static/tour_elev.js?v={{ app_version }}"></script>
<script src="/static/tour_stage_detail.js?v={{ app_version }}"></script>
<script src="/static/tour_mob_nav.js?v={{ app_version }}"></script>
<script src="/static/share_layout.js?v={{ app_version }}"></script>
<script>
const TOKEN = {{ token | tojson }};

// ── Units (shared formatter — same one the tour pages use) ─────────────────────
const U = makeUnits({{ use_metric | tojson }});

function fmtDate(ts) {
  if(!ts) return '';
  try { return new Date(parseInt(ts)*1000).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}); } catch(e) { return ''; }
}

// ── Theme ──────────────────────────────────────────────────────────────────────
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('ascent-share-theme', next); } catch(e) {}
}
(function(){ try { const t = localStorage.getItem('ascent-share-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch(e) {} })();

// ── Map + glue globals the shared elevation strip (tour_elev.js) expects ────────
let shareMap = null, tileLayer = null, routeGroup = null, _lastBounds = null, mapH = 0;
let _shareLbMedia = [], _act = null;
function getStageMap() { return shareMap; }
function tourChromeH() { return (Math.min(window.innerWidth, window.innerHeight) <= 767) ? 52 : 44; }
function _syncStageListHeight() {}                       // no stage-list sidebar here
window.refitTourMap = function () { if (shareMap && _lastBounds) shareMap.fitBounds(_lastBounds, {padding:[24,24]}); };

function initMap() {
  // The map fills #map-col via CSS (share_detail.css); no explicit height needed.
  shareMap = L.map('map', {zoomControl:true, attributionControl:true}).setView([20,0], 2);
  setMapStyle('osm', true);
  routeGroup = L.featureGroup().addTo(shareMap);
  MapUtils.addScale(shareMap, U.metric);
  MapUtils.wirePhotoToggle(document.getElementById('mapPhotosToggle'), shareMap);
  new ResizeObserver(() => shareMap && shareMap.invalidateSize({animate:false}))
    .observe(document.getElementById('map'));
}

// ── Route (a single activity → the "selected stage" look: bold red + start/end) ──
function drawRoute(pts) {
  routeGroup.clearLayers();
  if(!pts?.length) return;
  const lpts = pts.map(p => [p[0], p[1]]);
  L.polyline(lpts, {color:'#ef4444', weight:5, opacity:1}).addTo(routeGroup);
  L.marker(lpts[0], {icon:_startIcon, zIndexOffset:200, interactive:false}).addTo(routeGroup);
  L.marker(lpts[lpts.length-1], {icon:_endIcon, zIndexOffset:200, interactive:false}).addTo(routeGroup);
  _lastBounds = L.latLngBounds(lpts);
}

// ── Detail (INFO pane) + PHOTOS pane — reuse the shared renderers ────────────────
function renderActivity() {
  const el = document.getElementById('stage-detail');
  el.innerHTML = `<div id="act-detail-body" style="color:var(--muted);font-size:11px">Loading…</div>`;
  TourStageDetail.completedActivityBody(document.getElementById('act-detail-body'), _act, {
    weatherLocEndpoint: `/api/activities/${_act.id}/weather-location`,
    syncEndpoint: `/activities/share/${TOKEN}/sync`,
    onSynced: async () => {
      try { const d = await fetch(`/activities/share/${TOKEN}/data`).then(r=>r.json()); _act = d.activity; } catch(e) {}
      renderActivity();
    },
    analysis: TourNav.isPhone(),
  });
  // Photos: desktop/tablet fills the PHOTOS pane (which pins them on the map as a
  // side effect); phone uses its Photos tab, so it needs the map pins on their own.
  const pctx = { getMap: getStageMap, setMedia: m => { _shareLbMedia = m; } };
  if(TourNav.isPhone()) TourStageDetail.photoMarkers(_act.id, { ...pctx, lightboxName: 'openShareLightbox' });
  else TourStageDetail.photosPane(_act.id, pctx);
}

// ── Phone tab hooks (shared controller in tour_mob_nav.js) ──────────────────────
// Solo mode: the page is one activity, so it boots straight into the Map /
// Analysis / Photos tabs — same as a completed tour stage.
function openShareLightbox(idx) {
  Lightbox.open(_shareLbMedia, idx, {download:true, captionEdit:false});
}
window.renderStagePhotosTab = function (el) {
  TourStageDetail.photosTab(el, { activityId: _act && _act.id, lightboxName: 'openShareLightbox',
    setMedia: m => { _shareLbMedia = m; } });
};

// ── Boot ────────────────────────────────────────────────────────────────────────
(async function init() {
  _loadElevChartPrefs();
  initMap();

  let d;
  try {
    d = await fetch(`/activities/share/${TOKEN}/data`).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); });
  } catch(e) {
    document.getElementById('stage-detail').innerHTML = '<div style="color:#ef4444;font-size:12px">Failed to load activity data.</div>';
    return;
  }
  _act = d.activity;

  const badge = document.getElementById('mapBadge');
  if(badge) { badge.textContent = `${U.distS(_act.distance_mi||0)} · ${U.climbS(_act.total_climb_ft||0)} climb`; badge.style.display = 'block'; }

  renderActivity();

  // GPS track → shared elevation strip (ANALYSIS pane) + map route.
  try {
    const t = await fetch(`/activities/share/${TOKEN}/track`).then(r => r.json());
    const pts = t.points || [];
    const hasElev = pts.length && pts.some(p => p[2] && p[2] !== 0);
    ShareLayout.showAnalysis(!!hasElev);
    // Phone: the strip lives in the Analysis tab, so clear it explicitly — hiding the
    // desktop wrap doesn't reach it.
    if(!hasElev) hideStageElevation();
    if(pts.length) {
      drawRoute(pts);
      if(hasElev) drawStageElevation(pts);
      setTimeout(() => { shareMap.invalidateSize(); if(_lastBounds) shareMap.fitBounds(_lastBounds, {padding:[24,24]}); }, 150);
    }
  } catch(e) { ShareLayout.showAnalysis(false); hideStageElevation(); }
})();
</script>
</body>
</html>
