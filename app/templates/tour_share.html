<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{ tour_title }} — Ascent</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1c1c1e;--surface:#2c2c2e;--surface2:#3a3a3c;
  --border:#3a3a3c;--border2:#48484a;
  --text:#f2f2f7;--muted:#8e8e93;--muted2:#636366;
  --accent:#f97316;--nav-hover:rgba(255,255,255,.06);
  --lb-bg:rgba(0,0,0,.92);--lb-btn:rgba(255,255,255,.15);
  --lb-text:#fff;--lb-muted:#aaa;--lb-hint:#666;
}
[data-theme="light"]{--bg:#f2f2f7;--surface:#ffffff;--surface2:#e5e5ea;--border:#d1d1d6;--border2:#c7c7cc;--text:#1c1c1e;--muted:#6c6c70;--muted2:#8e8e93;--accent:#f97316;--nav-hover:rgba(0,0,0,.05);--lb-bg:rgba(215,215,225,.95);--lb-btn:rgba(0,0,0,.12);--lb-text:#1c1c1e;--lb-muted:#6c6c70;--lb-hint:#8e8e93}
@media(prefers-color-scheme:light){:root:not([data-theme]){--bg:#f2f2f7;--surface:#ffffff;--surface2:#e5e5ea;--border:#d1d1d6;--border2:#c7c7cc;--text:#1c1c1e;--muted:#6c6c70;--muted2:#8e8e93;--accent:#f97316;--nav-hover:rgba(0,0,0,.05);--lb-bg:rgba(215,215,225,.95);--lb-btn:rgba(0,0,0,.12);--lb-text:#1c1c1e;--lb-muted:#6c6c70;--lb-hint:#8e8e93}}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;font-size:13px;background:var(--bg);color:var(--text)}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
input,select{font:inherit}
a{color:var(--accent);text-decoration:none}
nav{height:44px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;flex-shrink:0}
.nav-brand-name{font-size:14px;font-weight:700;color:var(--accent)}
.nav-version{font-size:10px;color:var(--muted);margin-left:4px}
.spacer{flex:1}
.nav-sub{font-size:11px;color:var(--muted)}
#page{display:flex;height:calc(100vh - 44px - env(safe-area-inset-bottom,0px));overflow:hidden}
#sidebar{width:300px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}
#tour-header{padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
#tour-header-title{font-size:13px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tour-header-sub{font-size:11px;color:var(--muted)}
#stage-list-wrap{flex:1;overflow-y:auto}
#stage-list{padding:4px 0}
.stage-item{display:flex;align-items:center;gap:7px;padding:7px 10px;cursor:pointer;border-left:3px solid transparent}
.stage-item:hover{background:rgba(255,255,255,.04)}
.stage-item.active{background:rgba(249,115,22,.1);border-left-color:var(--accent)}
.stage-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.stage-item-body{flex:1;min-width:0}
.stage-item-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-item-sub{font-size:10px;color:var(--muted);margin-top:1px}
.stage-status{text-align:right;flex-shrink:0;min-width:52px}
.stage-status-done{font-size:12px;font-weight:600;color:#22c55e;line-height:1.2}
.stage-status-date{font-size:10px;color:var(--muted)}
.stage-status-none{font-size:14px;color:var(--muted2);line-height:1}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#map{width:100%;background:#1a2030;flex-shrink:0;position:relative}
.map-style-btn{background:rgba(0,0,0,.6);color:#ccc;border:1px solid rgba(255,255,255,.15);border-radius:4px;padding:2px 7px;font-size:11px;cursor:pointer;backdrop-filter:blur(4px);transition:all .15s}
.map-style-btn:hover{background:rgba(0,0,0,.8);color:#fff}
.map-style-btn.active{background:#f97316;color:#fff;border-color:#f97316}
#resize-handle{height:6px;background:var(--surface2);cursor:row-resize;flex-shrink:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);transition:background .1s;position:relative}
#resize-handle:hover,#resize-handle.dragging{background:var(--accent);opacity:.5}
#elev-resize-handle{height:8px;background:var(--surface2);cursor:row-resize;flex-shrink:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);transition:background .1s;position:relative}
#elev-resize-handle::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:28px;height:2px;border-radius:1px;background:var(--muted2);pointer-events:none;transition:background .1s}
#elev-resize-handle:hover,#elev-resize-handle.dragging{background:var(--border2)}
#elev-resize-handle:hover::after,#elev-resize-handle.dragging::after{background:var(--accent)}
@media(pointer:coarse){ #resize-handle{height:20px} #elev-resize-handle{height:18px}}
#mob-portrait-stats{display:none;flex-shrink:0}
#mob-portrait-stats.stats-collapsed{display:none}
#stats-toggle{display:none;position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#fff;padding:6px;line-height:1;font-size:20px;font-weight:700;z-index:1;text-shadow:0 1px 4px rgba(0,0,0,.6)}
#stage-elev-strip{height:100px;flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--border);position:relative;display:none;cursor:crosshair}
#stage-elev-canvas{width:100%;height:100%;display:block}
#stage-elev-xhair{display:none;position:absolute;pointer-events:none}
.se-hover-panel{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:7px 14px;pointer-events:none;display:none;z-index:15;min-width:150px;white-space:nowrap}
[data-theme="light"] .se-hover-panel{background:rgba(15,15,25,.72);border-color:rgba(0,0,0,.18)}
@media(prefers-color-scheme:light){:root:not([data-theme]) .se-hover-panel{background:rgba(15,15,25,.72);border-color:rgba(0,0,0,.18)}}
.se-hover-panel .eh-row{display:flex;justify-content:space-between;gap:18px;font-size:11px;line-height:1.75;font-family:-apple-system,sans-serif}
.se-hover-panel .eh-label{color:rgba(255,255,255,.45);letter-spacing:.01em}
.se-hover-panel .eh-val{font-weight:600;font-variant-numeric:tabular-nums;text-shadow:0 0 8px currentColor}
.se-sel-stats{position:absolute;background:rgba(0,0,0,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(74,222,128,.28);border-radius:10px;padding:7px 13px;pointer-events:auto;display:none;z-index:16;white-space:nowrap}
.se-sel-stats .es-header{display:flex;justify-content:space-between;gap:24px;font-size:11px;line-height:1.7;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:3px;padding-bottom:2px}
.se-sel-stats .es-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:18px;row-gap:0}
.se-sel-stats .es-row{display:flex;justify-content:space-between;gap:14px;font-size:11px;line-height:1.7}
.se-sel-stats .es-lbl{color:rgba(255,255,255,.42);letter-spacing:.01em}
.se-sel-stats .es-val{font-weight:600;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.88)}
.se-sel-stats .es-max-lbl{text-decoration:underline;cursor:pointer;pointer-events:auto}
.se-sel-stats .es-maxat{flex:1;text-align:center}
#stage-elev-hud-btn{position:absolute;top:4px;left:6px;z-index:15;font-size:10px;padding:2px 5px;line-height:1.4;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);color:#ccc;border-radius:5px;cursor:pointer;user-select:none;-webkit-user-select:none}
#stage-elev-hud-btn.active{background:#f97316;border-color:#f97316;color:#fff}
#stage-detail{flex:1;overflow-y:auto;padding:16px 20px;min-height:0}
.section-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:7px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;align-content:start;margin-bottom:8px;flex:1;min-width:0}
.stat-chip{background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:5px 4px;display:flex;flex-direction:column;align-items:center}
.sc-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px}
.sc-val{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.sc-sub{font-size:10px;color:var(--muted);margin-top:2px;min-height:1.2em;font-variant-numeric:tabular-nums}
.act-notes{font-size:12px;color:var(--text);background:var(--surface2);border-radius:6px;padding:8px;margin-bottom:8px;line-height:1.5;white-space:pre-wrap}
/* ── AI cards ── */
.ai-card{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;margin-top:14px}
.ai-card-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:5px;font-weight:600}
.ai-card-body{font-size:12px;color:var(--text);line-height:1.6}
.ai-card-loading{font-size:11px;color:var(--muted);font-style:italic}

/* ── Mobile layout ─────────────────────────────────────────────────── */
#mob-tour-header{display:none}
@media(max-width:767px),(max-height:500px) and (orientation:landscape) and (pointer:coarse){
  nav{display:none}
  #mob-tour-header{
    display:flex;align-items:center;gap:8px;
    position:fixed;top:0;left:0;right:0;height:52px;
    background:var(--surface);border-bottom:1px solid var(--border);
    z-index:600;padding:0 14px;font-size:14px;font-weight:600;flex-shrink:0
  }
  #mob-tour-back{
    font-size:16px;font-weight:500;color:var(--accent);
    background:none;border:none;cursor:pointer;
    padding:8px 4px;margin-right:2px;line-height:1
  }
  #resize-handle{height:28px;display:flex;align-items:center;justify-content:center;cursor:row-resize}
  #resize-handle::after{content:'';display:block;width:40px;height:4px;background:var(--border2);border-radius:2px}
  #stage-detail{-webkit-overflow-scrolling:touch;padding:12px}
}
/* ── Portrait: stacked layout ── */
@media(max-width:767px) and (orientation:portrait){
  #page{
    display:flex;flex-direction:column;
    height:calc(100vh - 52px - env(safe-area-inset-bottom,0px));margin-top:52px;
    overflow:hidden;position:static
  }
  #sidebar{display:contents}
  #tour-header{order:1;flex-shrink:0;border-bottom:1px solid var(--border)}
  #main{order:2;flex:0 0 auto;position:static;width:100%;display:flex;flex-direction:column}
  #stage-list-wrap{position:fixed;left:0;right:0;bottom:0;overflow-y:auto;display:flex;flex-direction:column;background:var(--bg);z-index:5;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
  #stage-detail{display:none;padding:12px}
  body.mob-stage-view #tour-header{display:none}
  body.mob-stage-view #stage-list-wrap{display:none}
  body.mob-stage-view #main{flex:1}
  body.mob-stage-view #stage-detail{display:block;position:fixed;left:0;right:0;bottom:0;overflow-y:scroll;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;background:var(--bg);z-index:20;padding:12px 12px 60px}
  #mob-portrait-stats{display:block;padding:8px;overflow-x:auto;border-bottom:1px solid var(--border)}
  body.mob-stage-view #mob-portrait-stats{display:none}
  #stats-toggle{display:block}
}
/* ── Landscape: sidebar left, map+detail right ── */
@media(max-height:500px) and (orientation:landscape) and (pointer:coarse){
  #page{
    display:flex;flex-direction:row;
    height:calc(100vh - 52px - env(safe-area-inset-bottom,0px));
    margin-top:52px;overflow:hidden
  }
  body.mob-landscape-stage #stage-detail{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  #sidebar{width:200px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
  #stage-list-wrap{position:static;flex:1;min-height:0}
  #tour-header{padding:6px}
  #main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
}
#mob-elev-hdr,#mob-info-hdr{display:none;height:28px;flex-shrink:0;background:var(--surface2);border-bottom:1px solid var(--border);align-items:center;padding:0 4px 0 12px;gap:4px}
#mob-elev-hdr span,#mob-info-hdr span{flex:1;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mob-disclose{background:none;border:none;color:var(--text);font-size:14px;cursor:pointer;padding:0 8px;line-height:1;display:flex;align-items:center;height:28px;flex-shrink:0}
.mob-arr{display:inline-block;transform:scale(2.25);transform-origin:center;transition:transform .2s}
.mob-arr.collapsed{transform:scale(2.25) rotate(-90deg)}
body.mob-stage-view #mob-elev-hdr,body.mob-stage-view #mob-info-hdr{display:flex}
</style>
</head>
<body>

<nav>
  <div style="display:flex;align-items:center">
    <a href="/"><img src="/static/favicon.svg" style="width:20px;height:20px;border-radius:4px;margin-right:6px;vertical-align:middle"><span class="nav-brand-name">Ascent</span></a><span class="nav-version">{{ app_version }}</span>
  </div>
  <div class="spacer"></div>
  <span class="nav-sub">Progress shared by <strong style="color:var(--text)">{{ display_name }}</strong></span>
</nav>

<div id="mob-tour-header">
  <button id="mob-tour-back" onclick="mobShareBack()">‹</button>
  <span id="mob-tour-title">{{ tour_title }}</span>
</div>

<div id="page">
  <div id="sidebar">
    <div id="tour-header">
      <div id="tour-header-title">{{ tour_title }}</div>
      <div id="tour-header-sub">Loading…</div>
      <div style="margin-top:6px;display:flex;align-items:center;gap:7px">
        <img src="/api/avatar/{{ share_uid }}?thumb=1" style="width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0" onerror="this.style.display='none'">
        <strong style="color:var(--text);font-size:13px">{{ display_name }}</strong>
      </div>
    </div>
    <div id="stage-list-wrap">
      <div id="stage-list"></div>
    </div>
  </div>

  <div id="main">
    <div id="map">
      <div style="position:absolute;top:8px;right:8px;z-index:500;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">
        <button class="map-style-btn active" data-style="osm"         onclick="setMapStyle('osm')">Street</button>
        <button class="map-style-btn"        data-style="topo"        onclick="setMapStyle('topo')">Topo</button>
        <button class="map-style-btn"        data-style="carto-dark"  onclick="setMapStyle('carto-dark')">Dark</button>
        <button class="map-style-btn"        data-style="carto-light" onclick="setMapStyle('carto-light')">Light</button>
        <button class="map-style-btn"        data-style="esri-sat"    onclick="setMapStyle('esri-sat')">Satellite</button>
      </div>
      <button onclick="resetZoom()" title="Reset zoom" style="position:absolute;bottom:24px;left:8px;z-index:500;background:rgba(0,0,0,.6);color:#ccc;border:1px solid rgba(255,255,255,.15);border-radius:4px;padding:3px 6px;font-size:13px;cursor:pointer;backdrop-filter:blur(4px)"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9"/></svg></button>
    </div>
    <div id="resize-handle" title="Drag to resize map"></div>
    <div id="mob-portrait-stats"></div>
    <div id="mob-elev-hdr"><span>Elevation</span><button class="mob-disclose" id="mob-elev-disclose" onclick="toggleMobElev()" title="Collapse elevation chart"><span class="mob-arr">▾</span></button></div>
    <div id="stage-elev-strip">
      <canvas id="stage-elev-canvas"></canvas>
      <div id="stage-elev-xhair"></div>
      <button id="stage-elev-hud-btn" onclick="_stageElevHudToggle()" title="Toggle hover HUD" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">HUD</button>
      <button id="stage-settings-btn" onclick="toggleStageSettings(event)" title="Chart settings" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()" style="position:absolute;top:4px;right:6px;z-index:15;font-size:18px;padding:2px 5px;line-height:1;background:rgba(0,0,0,.4);border:none;color:#ccc;border-radius:5px;cursor:pointer;user-select:none;-webkit-user-select:none">⚙</button>
    </div>
    <div id="elev-resize-handle" style="display:none" title="Drag to resize elevation chart"></div>
    <div id="stage-chart-settings" style="display:none;position:fixed;z-index:500;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.5);min-width:130px">
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px">Overlays</div>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);cursor:pointer;margin-bottom:10px">
        <input type="checkbox" id="stage-grade-cb" onchange="onStageGradeCbChange(this)" style="accent-color:#f97316"> Gradient
      </label>
      <div style="border-top:1px solid var(--border);padding-top:8px">
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);cursor:pointer">
          <input type="checkbox" id="stage-grade-colorcode" onchange="toggleStageColorCode()" style="accent-color:#f97316"> Color-code
        </label>
      </div>
    </div>
    <div id="mob-info-hdr"><span>Stage Info</span><button class="mob-disclose" id="mob-info-disclose" onclick="toggleMobInfo()" title="Collapse stage info"><span class="mob-arr">▾</span></button></div>
    <div id="stage-detail"><div style="color:var(--muted);font-size:12px">Loading tour…</div></div>
  </div>
</div>

<!-- Photo/video lightbox -->
<div id="share-lightbox" style="display:none;position:fixed;inset:0;z-index:9999;background:var(--lb-bg);align-items:center;justify-content:center;flex-direction:column" onclick="if(event.target===this)closeShareLightbox()">
  <button onclick="closeShareLightbox()" style="position:absolute;top:14px;right:18px;font-size:22px;color:var(--lb-text);background:none;border:none;cursor:pointer;line-height:1">✕</button>
  <button onclick="event.stopPropagation();shareNavLb(-1)" style="position:absolute;left:12px;font-size:28px;color:var(--lb-text);background:none;border:none;cursor:pointer;line-height:1;top:50%;transform:translateY(-50%)">‹</button>
  <button onclick="event.stopPropagation();shareNavLb(1)"  style="position:absolute;right:12px;font-size:28px;color:var(--lb-text);background:none;border:none;cursor:pointer;line-height:1;top:50%;transform:translateY(-50%)">›</button>
  <img id="slb-img" src="" style="max-width:90vw;max-height:78vh;object-fit:contain;border-radius:6px">
  <video id="slb-vid" controls playsinline style="display:none;max-width:90vw;max-height:78vh;border-radius:6px;background:#000" onclick="event.stopPropagation()"></video>
  <div id="slb-caption" style="display:none;color:var(--lb-text);font-size:13px;margin-top:10px;max-width:min(90vw,600px);text-align:center;line-height:1.4;opacity:.9" onclick="event.stopPropagation()"></div>
  <div style="display:flex;align-items:center;gap:14px;margin-top:10px" onclick="event.stopPropagation()">
    <span id="slb-count" style="color:var(--lb-muted);font-size:12px;min-width:50px;text-align:center"></span>
    <a id="slb-download" href="#" download style="font-size:12px;font-weight:600;color:#f97316;border:1px solid #f97316;border-radius:4px;padding:3px 10px;text-decoration:none">↓ Download</a>
  </div>
  <div style="color:var(--lb-hint);font-size:11px;margin-top:6px">Press Esc or click background to close · ← → to navigate</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/static/map_utils.js"></script>
<script src="/static/elev_panel.js?v={{ app_version }}"></script>
<script src="/static/stage_elev_chart.js?v={{ app_version }}"></script>
<script>
const TOKEN = {{ token | tojson }};

// ── Units ────────────────────────────────────────────────────────────────────
const U = {
  metric: {{ use_metric | tojson }},
  distS:  mi  => U.metric ? (mi*1.60934).toFixed(1)+' km' : mi.toFixed(1)+' mi',
  climbS: ft  => U.metric ? Math.round(ft*0.3048)+' m' : Math.round(ft)+' ft',
  speedS: mph => U.metric ? (mph*1.60934).toFixed(1)+' km/h' : mph.toFixed(1)+' mph',
  tempS:  f   => U.metric ? +((f-32)*5/9).toFixed(1)+' °C' : Math.round(f)+' °F',
  windS:  kph => U.metric ? Math.round(kph)+' km/h' : Math.round(kph/1.60934)+' mph',
  precipS:mm  => U.metric ? mm+' mm' : (mm/25.4).toFixed(2)+'"',
};

function fmtHMS(s) {
  if(!s) return '—';
  s = Math.round(s);

function _haversineMi(lat1, lon1, lat2, lon2) {
  const R=3958.8, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.asin(Math.sqrt(a));
}

  let cum=0; const chartPts=[], rawPts=[];
  for(let i=0;i<pts.length;i++){

    if(i%step===0||i===pts.length-1){chartPts.push({x:distConv(cum),y:altConv(pts[i][2]||0)});rawPts.push(pts[i]);}

// ── Biggest climb ─────────────────────────────────────────────────────────────
function biggestClimbInfo(pts) {
  if(!pts?.length||pts[0].length<3) return {gainFt:0,startKm:0};
  const raw=pts.map(p=>p[2]||0), half=2;
  const alts=raw.map((_,i)=>{let s=0,c=0;for(let j=Math.max(0,i-half);j<=Math.min(raw.length-1,i+half);j++){s+=raw[j];c++;}return s/c;});
  const cumKm=[0];
  for(let i=1;i<pts.length;i++) cumKm.push(cumKm[i-1]+_haversineMi(pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1])*1.60934);
  let best=0,bestKm=0,inClimb=false,startKm=0,startAlt=0,maxAlt=0,flatFt=0;
  for(let i=1;i<pts.length;i++){
    const dAlt=alts[i]-alts[i-1], dFt=(cumKm[i]-cumKm[i-1])*3280.84, grad=dFt>0?(dAlt/dFt)*100:0;
    if(!inClimb){if(grad>3){inClimb=true;startKm=cumKm[i-1];startAlt=alts[i-1];maxAlt=Math.max(alts[i-1],alts[i]);flatFt=0;}}
    else{if(grad>0){flatFt=0;maxAlt=Math.max(maxAlt,alts[i]);}else{flatFt+=dFt;if(flatFt>250){const g=maxAlt-startAlt;if(g>best){best=g;bestKm=startKm;}inClimb=false;flatFt=0;}}}
  }
  if(inClimb){const g=maxAlt-startAlt;if(g>best){best=g;bestKm=startKm;}}
  return {gainFt:best,startKm:bestKm};
}

async function reverseGeocode(lat, lon) {
  try {
    const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
    const d=await r.json();
    return [d.city||d.locality||d.principalSubdivision, d.countryName].filter(Boolean).slice(0,2).join(', ') || null;
  } catch(e) { return null; }
}

function drawRoutes(selId) {
  routeGroup.clearLayers();
  MapUtils.clearPhotoMarkers(shareMap);
  const stages=tourInfo?.stages||[], allPts=[], hasSel=selId!=null;
  stages.forEach(s => {
    const pts=pointsCache[String(s.id)]; if(!pts?.length) return;
    const lpts=pts.map(p=>[p[0],p[1]]), isSelected=hasSel&&String(s.id)===String(selId);
    L.polyline(lpts,{color:stageColor(s),weight:isSelected?5:3,opacity:hasSel?(isSelected?1:0.18):0.85}).addTo(routeGroup);
    allPts.push(...lpts);
  });
  if(!hasSel) {
    const first=stages[0];
    if(first?.start_lat!=null) L.marker([first.start_lat,first.start_lon],{icon:_startIcon,zIndexOffset:50,interactive:false}).addTo(routeGroup);
    stages.forEach(s => {
      if(s.start_lat==null||s.start_lon==null) return;
      const icon=L.divIcon({className:'',html:`<div style="width:16px;height:16px;border-radius:50%;background:#fff;border:1.5px solid #000;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#000;font-family:-apple-system,sans-serif;line-height:1;box-sizing:border-box">${s.stage_num}</div>`,iconSize:[16,16],iconAnchor:[8,8]});
      L.marker([s.start_lat,s.start_lon],{icon,zIndexOffset:150,interactive:false}).addTo(routeGroup);
    });
    const last=stages[stages.length-1], lastPts=last?pointsCache[String(last.id)]:null;
    if(lastPts?.length) L.marker(lastPts[lastPts.length-1],{icon:_endIcon,zIndexOffset:200,interactive:false}).addTo(routeGroup);
    if(allPts.length) _lastBounds=L.latLngBounds(allPts);
  } else {
    const pts=pointsCache[String(selId)];
    if(pts?.length){L.marker(pts[0],{icon:_startIcon,zIndexOffset:200,interactive:false}).addTo(routeGroup);L.marker(pts[pts.length-1],{icon:_endIcon,zIndexOffset:200,interactive:false}).addTo(routeGroup);}
  }
}

// ── Stage list ────────────────────────────────────────────────────────────────
function renderStageList() {
  const list=document.getElementById('stage-list'), stages=tourInfo?.stages||[];
  list.innerHTML = stages.map(s => {
    const statusHtml = s.completion
      ? `<div class="stage-status"><div class="stage-status-done">✓</div><div class="stage-status-date">${s.completion.date}</div></div>`
      : `<div class="stage-status"><div class="stage-status-none">—</div></div>`;
    return `<div class="stage-item${String(s.id)===String(selectedId)?' active':''}" onclick="selectStage('${s.id}')">
      <span class="stage-dot" style="background:${stageColor(s)}"></span>
      <div class="stage-item-body"><div class="stage-item-name">${esc(s.name)}</div><div class="stage-item-sub">${U.distS(s.distance_mi)} · ${U.climbS(s.climb_ft)} climb</div></div>${statusHtml}</div>`;
  }).join('');
}

// ── Strava sync for completed stage ───────────────────────────────────────────
let _syncActId = null, _syncStageId = null;

async function doShareSync() {
  if(!_syncActId || !_syncStageId) return;
  const btn = document.getElementById('share-sync-btn');
  if(btn) { btn.disabled = true; btn.textContent = '↻ Syncing…'; }
  try {
    const r = await fetch(`/tours/share/${TOKEN}/activities/${_syncActId}/sync`, {method:'POST'});
    if(!r.ok) {
      if(btn) { btn.disabled=false; btn.textContent='↻ Sync'; }
      return;
    }
    await renderDetail(_syncStageId);
    const nb = document.getElementById('share-sync-btn');
    if(nb) {
      nb.textContent='✓ Synced'; nb.style.color='#30d158';
      setTimeout(()=>{ nb.textContent='↻ Sync'; nb.style.color=''; }, 2500);
    }
  } catch(e) {
    const b = document.getElementById('share-sync-btn');
    if(b) { b.disabled=false; b.textContent='↻ Sync'; }
  }
}

// ── Stage selection ───────────────────────────────────────────────────────────
function selectStage(id) {
  selectedId = (String(id)===String(selectedId)) ? null : id;
  renderStageList(); drawRoutes(selectedId); renderDetail(selectedId);
  if(selectedId) {
    const pts=pointsCache[String(selectedId)];
    if(pts?.length) shareMap.fitBounds(L.latLngBounds(pts.map(p=>[p[0],p[1]])),{padding:[24,24]});
  } else { resetZoom(); }
  if (isMobTour()) {
    if (isPortrait()) {
      if (selectedId) {
        document.body.classList.add('mob-stage-view');
        document.getElementById('stage-detail').style.top = _stageDetailTop();
        const s = (tourInfo?.stages||[]).find(s => String(s.id) === String(selectedId));
        document.getElementById('mob-tour-title').textContent = s ? `Stage ${s.stage_num}: ${s.name}` : 'Stage';
      } else {
        document.body.classList.remove('mob-stage-view');
        document.getElementById('stage-detail').style.top = '';
        document.getElementById('mob-tour-title').textContent = tourInfo?.title || '{{ tour_title }}';
        _syncStageListHeight();
      }
      setTimeout(() => shareMap && shareMap.invalidateSize(), 50);
    } else {
      if (selectedId) { document.body.classList.add('mob-landscape-stage'); }
      else { document.body.classList.remove('mob-landscape-stage'); }
      setTimeout(() => shareMap && shareMap.invalidateSize(), 60);
    }
  }
}

// ── Portrait back button ───────────────────────────────────────────────────────
function mobShareBack() {
  if (document.body.classList.contains('mob-stage-view')) {
    document.body.classList.remove('mob-stage-view');
    document.getElementById('stage-detail').style.top = '';
    selectedId = null;
    document.getElementById('mob-tour-title').textContent = tourInfo?.title || '{{ tour_title }}';
    renderStageList(); drawRoutes(null); renderDetail(null);
    setTimeout(() => { shareMap && shareMap.invalidateSize(); _syncStageListHeight(); }, 50);
  } else {
    window.location.href = '/';
  }
}

// ── Orientation change ────────────────────────────────────────────────────────
(function() {
  function _applyMapH() {
    const mapEl  = document.getElementById('map');
    const pageEl = document.getElementById('page');
    if (!mapEl) return;
    const availH = window.innerHeight - tourChromeH();
    if (pageEl) pageEl.style.height = availH + 'px';
    const frac = isPortrait() ? 0.38 : 0.55;
    mapH = Math.round(availH * frac);
    mapEl.style.height = mapH + 'px';
  }
  function _doOrientFix() {
    if (!selectedId) {
      document.body.classList.remove('mob-stage-view', 'mob-landscape-stage');
      document.getElementById('stage-detail').style.top = '';
      _syncStageListHeight(); _applyMapH();
      shareMap && shareMap.invalidateSize();
      return;
    }
    if (isPortrait()) {
      document.body.classList.remove('mob-landscape-stage');
      document.body.classList.add('mob-stage-view');
      _applyMapH();
      document.getElementById('stage-detail').style.top = _stageDetailTop();
    } else {
      document.body.classList.remove('mob-stage-view');
      document.getElementById('stage-detail').style.top = '';
      document.body.classList.add('mob-landscape-stage');
      _applyMapH();
    }
    shareMap && shareMap.invalidateSize();
  }
  let _orientTimer = null;
  window.addEventListener('resize', () => {
    if (!isMobTour()) return;
    clearTimeout(_orientTimer);
    _orientTimer = setTimeout(() => {
      _doOrientFix();
      setTimeout(() => { _applyMapH(); shareMap && shareMap.invalidateSize(); }, 400);
    }, 100);
  });
})();

// ── Detail pane ───────────────────────────────────────────────────────────────
async function renderDetail(activeId) {
  const el=document.getElementById('stage-detail'), stages=tourInfo?.stages||[];

  if(!activeId) {
    // ── Overview ──────────────────────────────────────────────────────────────
    hideStageElevation();
    const done=stages.filter(s=>s.completion);
    const totalDist=stages.reduce((a,x)=>a+(x.distance_mi||0),0);
    const totalClimb=stages.reduce((a,x)=>a+(x.climb_ft||0),0);
    const doneDist=done.reduce((a,x)=>a+(x.completion?.distance_mi??x.distance_mi??0),0);
    const doneClimb=done.reduce((a,x)=>a+(x.completion?.climb_ft??x.climb_ft??0),0);
    const pctD=totalDist>0?Math.round(doneDist/totalDist*100):0;
    const pctC=totalClimb>0?Math.round(doneClimb/totalClimb*100):0;
    const n=stages.length||1, avgDist=totalDist/n, avgClimb=totalClimb/n;
    const maxDistIdx=stages.reduce((mi,x,i)=>(x.distance_mi||0)>(stages[mi].distance_mi||0)?i:mi,0);
    const maxClimbIdx=stages.reduce((mi,x,i)=>(x.climb_ft||0)>(stages[mi].climb_ft||0)?i:mi,0);
    const maxDist=stages[maxDistIdx]?.distance_mi||0, maxClimb=stages[maxClimbIdx]?.climb_ft||0;
    const ad=U.metric?totalDist.toFixed(1)+' mi':(totalDist*1.60934).toFixed(1)+' km';
    const ac=U.metric?Math.round(totalClimb)+' ft':Math.round(totalClimb*0.3048)+' m';
    const aad=U.metric?avgDist.toFixed(1)+' mi':(avgDist*1.60934).toFixed(1)+' km';
    const aac=U.metric?Math.round(avgClimb)+' ft':Math.round(avgClimb*0.3048)+' m';
    const amd=U.metric?maxDist.toFixed(1)+' mi':(maxDist*1.60934).toFixed(1)+' km';
    const amc=U.metric?Math.round(maxClimb)+' ft':Math.round(maxClimb*0.3048)+' m';
    let html=`<div class="stats-grid" style="grid-template-columns:repeat(7,1fr);margin-bottom:14px">`;
    html+=`<div class="stat-chip" style="white-space:nowrap"><div class="sc-label">Stages</div><div class="sc-val">${done.length} / ${stages.length}</div><div class="sc-sub">completed</div></div>`;
    html+=`<div class="stat-chip" style="white-space:nowrap"><div class="sc-label">Total Dist</div><div class="sc-val">${U.distS(totalDist)}</div><div class="sc-sub" style="font-size:10px;opacity:.65">${ad}</div><div class="sc-sub">${U.distS(doneDist)} done (${pctD}%)</div></div>`;
    html+=`<div class="stat-chip" style="white-space:nowrap"><div class="sc-label">Total Ascent</div><div class="sc-val">${U.climbS(totalClimb)}</div><div class="sc-sub" style="font-size:10px;opacity:.65">${ac}</div><div class="sc-sub">${U.climbS(doneClimb)} done (${pctC}%)</div></div>`;
    html+=`<div class="stat-chip" style="white-space:nowrap"><div class="sc-label">Avg Dist</div><div class="sc-val">${U.distS(avgDist)}</div><div class="sc-sub" style="font-size:10px;opacity:.65">${aad}</div><div class="sc-sub">per stage</div></div>`;
    html+=`<div class="stat-chip" style="white-space:nowrap"><div class="sc-label">Avg Ascent</div><div class="sc-val">${U.climbS(avgClimb)}</div><div class="sc-sub" style="font-size:10px;opacity:.65">${aac}</div><div class="sc-sub">per stage</div></div>`;
    html+=`<div class="stat-chip" style="white-space:nowrap"><div class="sc-label">Max Stage Dist</div><div class="sc-val">${U.distS(maxDist)}</div><div class="sc-sub" style="font-size:10px;opacity:.65">${amd}</div><div class="sc-sub">Stage ${maxDistIdx+1}</div></div>`;
    html+=`<div class="stat-chip" style="white-space:nowrap"><div class="sc-label">Max Ascent</div><div class="sc-val">${U.climbS(maxClimb)}</div><div class="sc-sub" style="font-size:10px;opacity:.65">${amc}</div><div class="sc-sub">Stage ${maxClimbIdx+1}</div></div>`;
    html+=`</div>`;
    const first=stages[0], lastSt=stages[stages.length-1];
    const lastPts=lastSt?(pointsCache[String(lastSt.id)]||[]):[], lastPt=lastPts.length?lastPts[lastPts.length-1]:null;
    html+=`<div style="display:flex;flex-direction:column;gap:6px">`;
    if(first?.start_lat!=null) html+=`<div style="font-size:12px"><span style="color:var(--muted);margin-right:6px">Start:</span><span id="ov-start-loc">Loading…</span></div>`;
    if(lastPt) html+=`<div style="font-size:12px"><span style="color:var(--muted);margin-right:6px">End:</span><span id="ov-end-loc">Loading…</span></div>`;
    html+=`</div>`;
    el.innerHTML=html;
    const _mpsEl=document.getElementById('mob-portrait-stats');
    if(_mpsEl) _mpsEl.innerHTML=`<div class="stats-grid">${
      `<div class="stat-chip" style="white-space:nowrap"><div class="sc-label">Stages</div><div class="sc-val">${done.length} / ${stages.length}</div><div class="sc-sub">completed</div></div>`+
      `<div class="stat-chip" style="white-space:nowrap"><div class="sc-label">Total Dist</div><div class="sc-val">${U.distS(totalDist)}</div><div class="sc-sub">${U.distS(doneDist)} done</div></div>`+
      `<div class="stat-chip" style="white-space:nowrap"><div class="sc-label">Total Ascent</div><div class="sc-val">${U.climbS(totalClimb)}</div><div class="sc-sub">${U.climbS(doneClimb)} done</div></div>`
    }</div>`;
    if(first?.start_lat!=null) reverseGeocode(first.start_lat,first.start_lon).then(loc=>{const e=document.getElementById('ov-start-loc');if(e)e.textContent=loc||'—';});
    if(lastPt) reverseGeocode(lastPt[0],lastPt[1]).then(loc=>{const e=document.getElementById('ov-end-loc');if(e)e.textContent=loc||'—';});
    if(tourInfo.ai_summary) {
      el.insertAdjacentHTML('beforeend',`<div class="ai-card"><div class="ai-card-label">AI Tour Summary</div><div class="ai-card-body">${esc(tourInfo.ai_summary)}</div></div>`);
    }
    return;
  }

  const stage=stages.find(s=>String(s.id)===String(activeId));
  if(!stage){el.innerHTML='';return;}
  const _mps=document.getElementById('mob-portrait-stats');
  if(_mps) _mps.innerHTML='';

  const _sIdx=stages.findIndex(s=>String(s.id)===String(stage.id));
  const _prevS=_sIdx>0?stages[_sIdx-1]:null;
  const _nextS=_sIdx<stages.length-1?stages[_sIdx+1]:null;
  const _navBtn=(s,arrow)=>s
    ?`<button onclick="selectStage('${s.id}')" title="Stage ${s.stage_num}" style="background:none;border:1px solid var(--border2);border-radius:4px;width:26px;height:24px;font-size:13px;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0">${arrow}</button>`
    :`<button disabled style="background:none;border:1px solid var(--border2);border-radius:4px;width:26px;height:24px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.3">${arrow}</button>`;
  const _stageNavHtml=`<div style="display:flex;gap:4px;margin-right:4px;flex-shrink:0">${_navBtn(_prevS,'←')}${_navBtn(_nextS,'→')}</div>`;
  const _entireTourBtn=`<div style="padding:14px 0 6px"><button onclick="selectStage('${stage.id}')" style="width:100%;padding:11px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;text-align:center">← Entire Tour</button></div>`;
  const stageHead=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><div style="font-size:15px;font-weight:600;line-height:1.3;flex:1">Stage ${stage.stage_num}: ${esc(stage.name)}</div>${_stageNavHtml}</div>`;

  if(!stage.completion) {
    // ── Uncompleted stage ────────────────────────────────────────────────────
    const pts=pointsCache[String(stage.id)];
    drawStageElevation(pts);

    const distP=U.metric?(+(stage.distance_mi*1.60934).toFixed(1))+' km':(+stage.distance_mi).toFixed(1)+' mi';
    const distS=U.metric?(+stage.distance_mi.toFixed(1))+' mi':(+(stage.distance_mi*1.60934).toFixed(1))+' km';
    const climP=U.metric?Math.round(stage.climb_ft*0.3048)+' m':Math.round(stage.climb_ft)+' ft';
    const climS=U.metric?Math.round(stage.climb_ft)+' ft':Math.round(stage.climb_ft*0.3048)+' m';
    const {gainFt:bigFt,startKm:bigKm}=biggestClimbInfo(pts);
    const bigP=U.metric?Math.round(bigFt*0.3048)+' m':Math.round(bigFt)+' ft';
    const bigS=U.metric?Math.round(bigFt)+' ft':Math.round(bigFt*0.3048)+' m';
    const bigAt=U.metric?`at ${bigKm.toFixed(1)} km`:`at ${(bigKm*0.621371).toFixed(1)} mi`;

    let html=stageHead;
    html+=`<div class="section-label" style="margin-bottom:6px">Estimated Route</div>`;
    html+=`<div class="stats-grid" style="grid-template-columns:repeat(${bigFt>0?3:2},1fr);margin-bottom:10px">`;
    html+=chip4('Distance',distP,distS,'&nbsp;');
    html+=chip4('Total Ascent',climP,climS,'&nbsp;');
    if(bigFt>0) html+=chip4('Biggest Ascent',bigP,bigS,bigAt);
    html+=`</div>`;
    html+=`<div style="display:flex;align-items:baseline;gap:10px;min-height:1.4em">
      <div style="flex:1;font-size:11px;color:var(--muted)"><span style="font-size:10px;text-transform:uppercase;letter-spacing:.06em">Trajectory:</span> <span id="share-loc-text">Loading…</span></div>
      <a href="/tours/share/${TOKEN}/stages/${stage.id}/export/gpx" download style="flex-shrink:0;font-size:11px;font-weight:600;color:#f97316;border:1px solid #f97316;border-radius:4px;padding:2px 8px;text-decoration:none;line-height:1.6">↓ GPX</a>
    </div>`;
    html+=`<div style="margin-top:6px;font-size:11px;color:var(--muted)"><span style="font-size:10px;text-transform:uppercase;letter-spacing:.06em">Forecast:</span> <span id="share-forecast-text">Loading…</span></div>`;
    el.innerHTML=html;

    // Trajectory geocode (3 sample points)
    if(pts?.length) {
      const p0=pts[0], pm=pts[Math.floor(pts.length/2)], pn=pts[pts.length-1];
      Promise.all([reverseGeocode(p0[0],p0[1]), reverseGeocode(pm[0],pm[1]), reverseGeocode(pn[0],pn[1])]).then(locs=>{
        const deduped=locs.filter(Boolean).filter((p,i,a)=>i===0||p!==a[i-1]);
        const locEl=document.getElementById('share-loc-text'); if(locEl) locEl.textContent=deduped.join(' → ')||'';
      });
    } else { const e=document.getElementById('share-loc-text');if(e)e.textContent=''; }

    // Forecast
    fetch(`/tours/share/${TOKEN}/stages/${stage.id}/forecast`)
      .then(r=>r.json()).then(d=>{
        const txt=document.getElementById('share-forecast-text'); if(!txt) return;
        if(d.out_of_range){txt.textContent='unavailable';return;}
        const fc=d.forecast; if(!fc){txt.textContent='';return;}
        const parts=[];
        if(fc.description) parts.push(fc.description);
        if(fc.temp_max_f!=null&&fc.temp_min_f!=null) parts.push(U.tempS(fc.temp_max_f)+' / '+U.tempS(fc.temp_min_f));
        if(fc.wind_kph!=null) parts.push('Wind '+U.windS(fc.wind_kph));
        if(fc.precip_mm>0) parts.push(U.precipS(fc.precip_mm));
        txt.textContent=parts.join(' · ');
      }).catch(()=>{const t=document.getElementById('share-forecast-text');if(t)t.textContent='';});

    // AI Stage Summary — cached only, no regeneration. AI Coach Advice NOT shown.
    fetch(`/tours/share/${TOKEN}/stages/${stage.id}/ai-summary`)
      .then(r=>r.ok?r.json():null).then(d=>{
        if(d?.summary) el.insertAdjacentHTML('beforeend',`<div class="ai-card"><div class="ai-card-label">AI Stage Summary</div><div class="ai-card-body">${esc(d.summary)}</div></div>`);
        el.insertAdjacentHTML('beforeend',_entireTourBtn);
      }).catch(()=>{ el.insertAdjacentHTML('beforeend',_entireTourBtn); });

  } else {
    // ── Completed stage ──────────────────────────────────────────────────────
    drawStageElevation(pointsCache[String(activeId)]);
    const c=stage.completion;
    el.innerHTML=stageHead+
      `<div style="font-size:11px;color:#22c55e;font-weight:500;margin-bottom:10px">✓ Completed ${c.date}</div>`+
      `<div id="act-detail-body" style="color:var(--muted);font-size:11px">Loading…</div>`;

    if(!c.activity_id){_renderActFallback(c);return;}

    fetch(`/tours/share/${TOKEN}/activities/${c.activity_id}`)
      .then(r=>r.ok?r.json():Promise.reject())
      .then(act=>{
        const body=document.getElementById('act-detail-body'); if(!body) return;

        // Register for sync
        _syncActId=act.id; _syncStageId=activeId;

        function altPaceStr(mph,perMile){
          if(!mph||mph<=0) return null;
          const mins=perMile?60/mph:60/(mph*1.60934), m=Math.floor(mins), s=Math.round((mins-m)*60);
          return `${m}:${String(s).padStart(2,'0')}/${perMile?'mi':'km'}`;
        }
        const chips=[
          ['Distance',  act.distance_mi?U.distS(act.distance_mi):null, act.distance_mi?(U.metric?(+act.distance_mi.toFixed(2))+' mi':(+(act.distance_mi*1.60934).toFixed(2))+' km'):null],
          ['Mov Time',  act.active_time?fmtHMS(act.active_time):null, null],
          ['Duration',  act.duration?fmtHMS(act.duration):null, null],
          ['Ascent',    act.total_climb_ft?U.climbS(act.total_climb_ft):null, act.total_climb_ft?(U.metric?Math.round(act.total_climb_ft)+' ft':Math.round(act.total_climb_ft*0.3048)+' m'):null],
          ['Descent',   act.total_descent_ft?U.climbS(act.total_descent_ft):null, act.total_descent_ft?(U.metric?Math.round(act.total_descent_ft)+' ft':Math.round(act.total_descent_ft*0.3048)+' m'):null],
          ['Mov Spd',   act.avg_speed_mph?U.speedS(act.avg_speed_mph):null, act.avg_speed_mph?(U.metric?act.avg_speed_mph.toFixed(1)+' mph':(act.avg_speed_mph*1.60934).toFixed(1)+' km/h'):null],
          ['Avg Spd',   (act.duration&&act.distance_mi)?U.speedS(+(act.distance_mi/(act.duration/3600)).toFixed(1)):null,(act.duration&&act.distance_mi)?(()=>{const mph=+(act.distance_mi/(act.duration/3600)).toFixed(1);return U.metric?mph+' mph':(+(mph*1.60934).toFixed(1))+' km/h';})():null],
          ['Avg Pace',  act.avg_speed_mph?altPaceStr(act.avg_speed_mph,!U.metric):null, act.avg_speed_mph?altPaceStr(act.avg_speed_mph,U.metric):null],
          ['Avg HR',    act.avg_heartrate?Math.round(act.avg_heartrate)+' bpm':null, null],
          ['Max HR',    act.max_heartrate?Math.round(act.max_heartrate)+' bpm':null, null],
          ['Cadence',   act.avg_cadence?Math.round(act.avg_cadence)+' rpm':null, null],
          ['Avg Pwr',   act.avg_power?Math.round(act.avg_power)+' W':null, act.max_power?'max '+Math.round(act.max_power)+' W':null],
          ['Suffer',    act.suffer_score?Math.round(act.suffer_score)+'':null, null],
          ['Type',      act.activity_type?esc(act.activity_type):null, null],
          ['Equipment', act.equipment?esc(act.equipment):null, null],
        ].filter(([,v])=>v);

        const _rpeLabels=['','Easy','Easy+','Moderate','Moderate+','Medium','Hard','Hard+','Very Hard','Max-','Max'];
        let rpeHtml='';
        if(act.perceived_exertion!=null){
          const v=act.perceived_exertion;
          rpeHtml=`<div style="font-size:11px;color:var(--muted);margin-bottom:6px">Effort: <span style="color:var(--text);font-weight:500">${_rpeLabels[v]||v}</span> <span style="color:var(--muted2)">(${v}/10)</span></div>`;
        }

        const stravaLink=act.strava_activity_id
          ?`<a href="https://www.strava.com/activities/${act.strava_activity_id}" target="_blank" style="font-size:11px;font-weight:600;color:#fc4c02;border:1px solid rgba(252,76,2,.4);border-radius:4px;padding:3px 8px;text-decoration:none;line-height:1.4;flex-shrink:0">View on Strava ↗</a>`
          :'';
        const syncBtn=act.strava_activity_id
          ?`<button id="share-sync-btn" onclick="doShareSync()" style="font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--border2);border-radius:4px;padding:3px 8px;background:none;cursor:pointer;line-height:1.4;flex-shrink:0">↻ Sync</button>`
          :'';

        let aHtml='';
        aHtml+=`<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px">
          <div style="font-size:14px;font-weight:600;line-height:1.3">${esc(act.name||'(unnamed)')}</div>
          <div style="display:flex;gap:6px;flex-shrink:0">${syncBtn}${stravaLink}</div>
        </div>`;
        const ts=act.start_time?fmtDate(act.start_time):'';
        aHtml+=`<div style="display:grid;grid-template-columns:auto 1fr;column-gap:20px;row-gap:3px;margin-bottom:7px;align-items:baseline">
          <span style="font-size:11.5px;color:var(--muted)">${ts}</span>
          <span id="share-wx" style="font-size:11px;color:var(--muted)"></span>
          <span></span>
          <span id="share-loc" style="font-size:11px;color:var(--muted)"></span>
        </div>`;
        aHtml+=rpeHtml;
        if(act.notes) aHtml+=`<div class="act-notes">${esc(act.notes)}</div>`;
        if(act.ai_summary) aHtml+=`<div class="ai-card" style="margin-top:8px;margin-bottom:8px"><div class="ai-card-label">AI Summary</div><div class="ai-card-body">${esc(act.ai_summary)}</div></div>`;
        aHtml+=`<div class="stats-grid">`;
        chips.forEach(([l,v,sub])=>{
          const span=l==='Equipment'?Math.min(6,Math.max(1,Math.ceil(v.length/14))):1;
          const s=span>1?` style="grid-column:span ${span}"`:'';;
          aHtml+=`<div class="stat-chip"${s}><div class="sc-label">${l}</div><div class="sc-val">${v}</div><div class="sc-sub">${sub||''}</div></div>`;
        });
        aHtml+=`</div>`;
        aHtml+=`<div id="share-photos"></div>`;
        body.innerHTML=aHtml;

        // Async: weather + location
        fetch(`/api/activities/${act.id}/weather-location`).then(r=>r.json()).then(d=>{
          const wx=document.getElementById('share-wx'), loc=document.getElementById('share-loc');
          if(wx&&d.weather?.description){const w=d.weather,parts=[w.description];if(w.avg_temp_f!=null)parts.push(U.tempS(w.avg_temp_f));if(w.avg_wind_kph!=null)parts.push('Wind '+U.windS(w.avg_wind_kph));if(w.precip_mm>0)parts.push(U.precipS(w.precip_mm));wx.textContent=parts.join(' · ');}
          if(loc&&d.locations) loc.textContent=d.locations;
        }).catch(()=>{});

        // Async: photos (flex-wrap, no autoplay)
        loadSharePhotos(act.id);

        el.insertAdjacentHTML('beforeend',_entireTourBtn);

        // Auto-sync if Strava description or photos not yet synced
        if(act.strava_activity_id && !act.notes) doShareSync();
      }).catch(()=>_renderActFallback(c));
  }
}

// ── Photos / videos ───────────────────────────────────────────────────────────
async function loadSharePhotos(actId) {
  MapUtils.clearPhotoMarkers(shareMap);
  try {
    const r=await fetch(`/activities/${actId}/photos`); if(!r.ok) return;
    const d=await r.json();
    const media=d.media||(d.photos?d.photos.map(f=>({url:d.base_url+f,type:'image'})):[]);
    if(!media.length) return;
    _shareLbMedia=media;
    const el=document.getElementById('share-photos'); if(!el) return;
    let ph=`<div class="section-label" style="margin-top:12px;margin-bottom:6px">Photos</div>`;
    ph+=`<div style="display:flex;flex-wrap:wrap;gap:6px;padding-bottom:6px;align-items:flex-start">`;
    media.forEach((m,i)=>{
      const cap=m.caption?`<div style="font-size:10px;color:var(--muted);margin-top:3px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word">${esc(m.caption)}</div>`:'';
      if(m.type==='image'){
        ph+=`<div style="flex-shrink:0;width:80px"><img src="${m.url}" loading="lazy" style="height:80px;width:80px;object-fit:cover;border-radius:5px;cursor:pointer;display:block" onclick="openShareLightbox(${i})">${cap}</div>`;
      } else {
        ph+=`<div style="flex-shrink:0;width:80px"><div style="position:relative;height:80px;width:80px;border-radius:5px;overflow:hidden;cursor:pointer;background:#000" onclick="openShareLightbox(${i})">
          <video src="${m.hls_url||m.url}" muted preload="metadata" playsinline
            style="width:100%;height:100%;object-fit:cover;pointer-events:none"
            onloadedmetadata="this.currentTime=0.1"></video>
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
            <div style="width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center">
              <span style="font-size:13px;margin-left:2px">▶</span>
            </div>
          </div>
        </div>${cap}</div>`;
      }
    });
    ph+=`</div>`;
    el.innerHTML=ph;
    MapUtils.placePhotoMarkers(shareMap, media, idx => openShareLightbox(idx));
  } catch(e) {}
}

function _renderActFallback(c) {
  const body=document.getElementById('act-detail-body'); if(!body) return;
  let fb=`<div class="stats-grid">`;
  if(c.distance_mi) fb+=mkStatChip('Distance',U.distS(c.distance_mi),'');
  if(c.climb_ft)    fb+=mkStatChip('Ascent',U.climbS(c.climb_ft),'');
  if(c.moving_s)    fb+=mkStatChip('Mov Time',fmtHMS(c.moving_s),'');
  if(c.duration_s)  fb+=mkStatChip('Duration',fmtHMS(c.duration_s),'');
  if(c.avg_hr)      fb+=mkStatChip('Avg HR',Math.round(c.avg_hr)+' bpm','');
  fb+=`</div>`;
  body.innerHTML=fb;
}
</script>
