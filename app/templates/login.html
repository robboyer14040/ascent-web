<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In — Ascent</title>
<link rel="stylesheet" href="/static/auth.css">
</head>
<body>
<div class="card">
  <div class="brand"><img src="/static/favicon.svg" style="width:32px;height:32px;border-radius:6px;margin-right:8px;vertical-align:middle">Ascent</div>
  <div class="subtitle">Sign in to your account</div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username or Email</label>
    <input type="text" name="email" autocomplete="username" autocorrect="off" autocapitalize="none" spellcheck="false" required autofocus>
    <label>Password</label>
    <input type="password" name="password" autocomplete="current-password" required>
    <button type="submit" class="btn">Sign In</button>
  </form>

  <div style="text-align:center;margin-top:.75rem">
    <a href="/forgot-password" style="color:#f97316;font-size:12px;text-decoration:none">Forgot password?</a>
  </div>

  <div class="footer">Ascent {{ app_version }}</div>
</div>
</body>
</html>
