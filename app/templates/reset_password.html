<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — Ascent</title>
<link rel="stylesheet" href="/static/auth.css">
</head>
<body>
<div class="card">
  <div class="brand"><img src="/static/favicon.svg" style="width:32px;height:32px;border-radius:6px;margin-right:8px;vertical-align:middle">Ascent</div>
  <div class="subtitle">Choose a new password</div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/reset-password">
    <input type="hidden" name="token" value="{{ token }}">
    <label>New Password</label>
    <input type="password" name="password" autocomplete="new-password" required autofocus minlength="8">
    <div class="hint">At least 8 characters</div>
    <label>Confirm Password</label>
    <input type="password" name="password2" autocomplete="new-password" required minlength="8">
    <button type="submit" class="btn">Set New Password</button>
  </form>

  <div class="footer">Ascent {{ app_version }}</div>
</div>
</body>
</html>
