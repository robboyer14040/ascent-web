<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account — Ascent</title>
<link rel="stylesheet" href="/static/auth.css">
</head>
<body>
<div class="card">
  <div class="brand"><img src="/static/favicon.svg" style="width:32px;height:32px;border-radius:6px;margin-right:8px;vertical-align:middle">Ascent</div>
  <div class="subtitle">Create your account</div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/register">
    <input type="hidden" name="token" value="{{ token }}">

    <label>Username</label>
    <input type="text" name="username" required autofocus autocomplete="username" placeholder="e.g. Rob">

    <label>Email</label>
    <input type="text" inputmode="email" name="email" required autocomplete="email" autocorrect="off" autocapitalize="none" spellcheck="false" value="{{ email }}">

    <label>Password</label>
    <input type="password" name="password" required autocomplete="new-password" minlength="8">
    <div class="hint">At least 8 characters</div>

    <label>Confirm Password</label>
    <input type="password" name="password2" required autocomplete="new-password">

    <button type="submit" class="btn">Create Account</button>
  </form>

  <div class="footer">Ascent {{ app_version }}</div>
</div>
</body>
</html>
